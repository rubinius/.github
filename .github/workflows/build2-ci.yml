name: Build2 CI

on:
  workflow_call:
    inputs:
      build-target:
        required: true
        type: string

jobs:
  build:
    name: ${{ inputs.build-target }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Homebrew (Linux)
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@master

      - name: Show Homebrew info
        run: |
          which brew || echo "brew not in PATH"
          brew --version

      - name: Install build2 via Homebrew
        run: |
          brew update
          brew install build2

      - name: Show tool versions
        run: |
          b --version
          $CXX --version

      - name: Setup
        run: |
          make setup

      - name: Configure
        run: |
          make config

      - name: Build
        run: |
          make build

      - name: Test
        run: |
          make test
